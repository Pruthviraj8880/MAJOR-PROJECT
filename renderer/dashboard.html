<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Innovation Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top navigation bar -->
  <nav class="navbar">
    <span class="brand">Innovation Portal</span>
    <div id="nav-links"></div>
    <div class="user-area">
      <span id="user-info"></span>
      <button onclick="logout()">Log out</button>
    </div>
  </nav>

  <div class="page">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
      <div>
        <h1 style="margin-bottom:4px;">Dashboard</h1>
        <p style="font-size:13px; color:#666;" id="role-welcome">Welcome to the Innovation Excellence Indicators Portal</p>
      </div>
      <div id="quick-actions" style="display:flex; gap:10px;"></div>
    </div>

    <!-- Quick stats — numbers filled in by JS -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="number" id="stat-entries">–</div>
        <div class="label">Total Entries</div>
      </div>
      <div class="stat-card">
        <div class="number" id="stat-pending">–</div>
        <div class="label">Pending Approval</div>
      </div>
      <div class="stat-card">
        <div class="number" id="stat-approved">–</div>
        <div class="label">Approved</div>
      </div>
      <div class="stat-card">
        <div class="number" id="stat-indicators">–</div>
        <div class="label">Indicator Types</div>
      </div>
    </div>

    <!-- Indicator Breakdown Summary -->
    <div class="card">
      <h2>Activity by Indicator Category</h2>
      <div id="category-summary" style="display:flex; flex-wrap:wrap; gap:12px; margin-top:8px;">
        <span style="color:#999; font-size:13px;">Loading breakdown…</span>
      </div>
    </div>

    <!-- Recent entries table -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h2>Recent Entries</h2>
        <a href="entries.html" style="font-size:13px; color:var(--primary); text-decoration:none;">View All Entries →</a>
      </div>
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Indicator</th>
            <th>Submitted By</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="recent-entries">
          <tr><td colspan="4" style="color:#999;">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="../config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    var user = requireAuth();
    if (user) {
      setText('user-info', user.name + ' (' + user.role + ')');
      setText('role-welcome', 'Logged in as ' + user.name + ' • ' + user.role.toUpperCase() + ' Portal');
      buildNav(user.role);
      renderQuickActions(user.role);
      loadDashboard();
    }

    function renderQuickActions(role) {
      var container = document.getElementById('quick-actions');
      if (role === 'admin') {
        container.innerHTML = '<a href="approval.html" class="btn btn-primary" style="text-decoration:none; font-size:13px;">Review Pending</a>' +
                              '<a href="indicators.html" class="btn btn-outline" style="text-decoration:none; font-size:13px;">+ New Indicator</a>';
      } else {
        container.innerHTML = '<a href="entries.html" class="btn btn-primary" style="text-decoration:none; font-size:13px;">+ Submit Achievement</a>' +
                              '<a href="import.html" class="btn btn-outline" style="text-decoration:none; font-size:13px;">Bulk Import</a>';
      }
    }

    function loadDashboard() {
      Promise.all([getEntries(), getIndicators()])
        .then(function (results) {
          var entries = results[0];
          var indicators = results[1];

          var pending  = entries.filter(function (e) { return e.status === 'pending'; }).length;
          var approved = entries.filter(function (e) { return e.status === 'approved'; }).length;

          setText('stat-entries', entries.length);
          setText('stat-pending', pending);
          setText('stat-approved', approved);
          setText('stat-indicators', indicators.length);

          renderCategorySummary(entries, indicators);
          renderRecentEntries(entries.slice(0, 5));
        })
        .catch(function (err) {
          showToast(err.message, 'error');
        });
    }

    function renderCategorySummary(entries, indicators) {
      var counts = {};
      indicators.forEach(function (ind) { counts[ind.name] = 0; });
      entries.forEach(function (e) {
        var name = e.indicatorName || 'Other';
        counts[name] = (counts[name] || 0) + 1;
      });

      var summaryDiv = document.getElementById('category-summary');
      summaryDiv.innerHTML = Object.keys(counts).map(function (name) {
        return '<div style="background:#f0f4ff; border:1px solid #dbeafe; padding:8px 14px; border-radius:6px; font-size:13px;">' +
               '<strong>' + name + ':</strong> <span style="color:var(--primary); font-weight:bold;">' + counts[name] + '</span>' +
               '</div>';
      }).join('');
    }

    function renderRecentEntries(entries) {
      var tbody = document.getElementById('recent-entries');
      if (entries.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="color:#999;">No entries yet</td></tr>';
        return;
      }

      tbody.innerHTML = entries.map(function (e) {
        var badgeClass = 'badge-' + e.status;
        return '<tr>' +
          '<td>' + e.title + '</td>' +
          '<td>' + (e.indicatorName || '—') + '</td>' +
          '<td>' + (e.submittedByName || '—') + '</td>' +
          '<td><span class="badge ' + badgeClass + '">' + e.status + '</span></td>' +
          '</tr>';
      }).join('');
    }
  </script>

</body>
</html>
